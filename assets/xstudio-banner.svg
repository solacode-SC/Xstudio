      <rect x="12" y="16" width="44" height="6" rx="2" fill="#0A0A0B"/>
      <rect x="12" y="28" width="58" height="4" rx="2" fill="#D4D4D8"/>
      <rect x="12" y="38" width="52" height="4" rx="2" fill="#D4D4D8"/>
      <rect x="12" y="54" width="58" height="32" rx="4" fill="#F4F4F5" stroke="#E4E4E7"/>
      <text x="12" y="99" fill="#0A0A0B" font-family="ui-monospace, monospace" font-size="9" font-weight="700">P.01</text>
    </g>

    <g transform="translate(118, 66)">
