<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1F1F23" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3F3F46"/>
    </pattern>
  </defs>

  <!-- Deep Obsidian Architectural Frame -->
  <rect width="1200" height="420" rx="20" fill="#0A0A0B"/>
  <rect x="1" y="1" width="1198" height="418" rx="19" stroke="#27272A" stroke-width="2"/>

  <!-- Subtle Technical Grid -->
  <rect x="24" y="24" width="1152" height="372" fill="url(#grid)" opacity="0.55"/>
  <rect x="740" y="40" width="420" height="340" fill="url(#dots)" opacity="0.45"/>

  <!-- Swiss Registration Crosshairs -->
  <g stroke="#52525B" stroke-width="1.5">
    <path d="M40 32V48M32 40H48"/>
    <path d="M1160 32V48M1152 40H1168"/>
    <path d="M40 372V388M32 380H48"/>
    <path d="M1160 372V388M1152 380H1168"/>
  </g>

  <!-- Top Editorial Eyebrow Pill -->
  <rect x="64" y="62" width="348" height="30" rx="6" fill="#18181B" stroke="#27272A"/>
  <circle cx="82" cy="77" r="5" fill="#FF4D00"/>
  <text x="98" y="81" fill="#E4E4E7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="600" letter-spacing="1.6">
    XSTUDIO ENGINE v2.0 // ZERO RETENTION
