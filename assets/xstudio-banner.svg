    <text x="38" y="215" fill="#A1A1AA" font-family="ui-monospace, monospace" font-size="10">DOMAIN</text>
    <text x="38" y="233" fill="#FFFFFF" font-family="ui-monospace, monospace" font-size="12" font-weight="700">xstudio.solaymanbuilds.com</text>
    <circle cx="274" cy="219" r="7" fill="#10B981"/>
