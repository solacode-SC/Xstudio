      <rect x="12" y="16" width="50" height="6" rx="2" fill="#FF4D00"/>
      <rect x="12" y="28" width="58" height="4" rx="2" fill="#D4D4D8"/>
      <rect x="12" y="38" width="46" height="4" rx="2" fill="#D4D4D8"/>
      <rect x="12" y="54" width="58" height="32" rx="4" fill="#FFF7ED" stroke="#FDBA74"/>
      <text x="12" y="99" fill="#FF4D00" font-family="ui-monospace, monospace" font-size="9" font-weight="700">300 DPI</text>
    </g>

    <g transform="translate(214, 66)">
      <rect width="82" height="106" rx="8" fill="#FFFFFF" stroke="#0A0A0B" stroke-width="2"/>
      <rect x="12" y="16" width="38" height="6" rx="2" fill="#0A0A0B"/>
      <rect x="12" y="28" width="58" height="4" rx="2" fill="#D4D4D8"/>
      <rect x="12" y="38" width="56" height="4" rx="2" fill="#D4D4D8"/>
      <rect x="12" y="54" width="58" height="32" rx="4" fill="#F4F4F5" stroke="#E4E4E7"/>
      <text x="12" y="99" fill="#0A0A0B" font-family="ui-monospace, monospace" font-size="9" font-weight="700">AES-256</text>
