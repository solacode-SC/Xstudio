  <text x="62" y="182" fill="#FAFAFA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-3.5">
    XSTUDIO
  </text>
  <rect x="502" y="116" width="16" height="16" fill="#FF4D00"/>

  <!-- Architectural Subtitle -->
  <text x="66" y="232" fill="#A1A1AA" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" letter-spacing="-0.3">
    Precision PDF Workbench — Lossless Vector &amp; Print-Grade Studio
  </text>

  <!-- Brutalist Vermilion Accent Rule -->
  <rect x="66" y="256" width="110" height="5" fill="#FF4D00"/>
  <rect x="184" y="256" width="340" height="1" y1="258" fill="#27272A"/>

  <!-- Bottom Technical Spec Blocks -->
  <g transform="translate(66, 292)">
    <rect width="150" height="64" rx="10" fill="#121215" stroke="#27272A"/>
    <text x="16" y="25" fill="#FF4D00" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="1">01 / SERVICES</text>
    <text x="16" y="48" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="18" font-weight="700">12 Pro Tools</text>
  </g>

  <g transform="translate(230, 292)">
    <rect width="162" height="64" rx="10" fill="#121215" stroke="#27272A"/>
    <text x="16" y="25" fill="#FF4D00" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="700" letter-spacing="1">02 / RESOLUTION</text>
    <text x="16" y="48" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Up to 600 DPI</text>
  </g>

  <g transform="translate(406, 292)">
