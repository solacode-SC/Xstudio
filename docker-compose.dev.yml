version: "3.8"

services:
  backend:
    build: ./backend
    container_name: xstudio_backend_dev
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    environment:
      - ENV=development

  frontend:
    build:
      context: ./frontend
      args:
        - BACKEND_ORIGIN=http://backend:8001
    container_name: xstudio_frontend_dev
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --hostname 0.0.0.0 --port 3001
    environment:
      - BACKEND_ORIGIN=http://backend:8001
    depends_on:
      - backend
