services:
  backend:
    build: ./backend
    container_name: xstudio_backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - ENV=production
      - ALLOWED_ORIGINS=https://xstudio.solaymanbuilds.com,http://xstudio.solaymanbuilds.com,http://localhost:3001
    networks:
      - xstudio_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  frontend:
    build:
      context: ./frontend
      args:
        - BACKEND_ORIGIN=http://backend:8001
    container_name: xstudio_frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - BACKEND_ORIGIN=http://backend:8001
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - xstudio_net
    command: npm run start -- -p 3001 -H 0.0.0.0

networks:
  xstudio_net:
    driver: bridge
