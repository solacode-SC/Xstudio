version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      args:
        - BACKEND_ORIGIN=http://backend:8001
    ports: ["3001:3001"]
    environment:
      - BACKEND_ORIGIN=http://backend:8001
    depends_on: [backend]
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --hostname 0.0.0.0 --port 3001

  backend:
    build: ./backend
    ports: ["8001:8001"]
    volumes:
      - ./backend:/app
    environment:
      - ENV=development
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload

networks:
  default:
    name: xstudio-network
